<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Atelier</title>
<style>
:root{--bg:#25272b;--panel:#2e3136;--line:#434850;--text:#ecebe7;--muted:#a3a8b0;--accent:#7fb2ff;--cell:#1c1d20;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;display:grid;grid-template-columns:292px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
h1{font-size:18px;font-weight:650;margin:0;letter-spacing:-.01em}
.panel{flex:1;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lbl{font-weight:550;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row output{color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.note{color:var(--muted);font-size:13px;margin:0}
select,button,input{font:inherit;color:inherit}
select{background:var(--cell);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:5px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--line);color:var(--text)}
input[type=range]{flex:1;accent-color:var(--accent)}
input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.btn{background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0f1b2e;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn small{display:block;font-weight:400;opacity:.75;font-variant-numeric:tabular-nums}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;padding:32px;min-width:0;min-height:0;overflow:auto}
.view{width:100%;display:flex;align-items:center;justify-content:center;margin:auto}
#stage{--r:1.7778;width:min(100%,calc((100vh - 64px) * var(--r)));aspect-ratio:var(--r);display:grid;background:#000;box-shadow:0 0 0 1px var(--line)}
.cell{position:relative;overflow:hidden;background:var(--cell);cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.cell.filled{background:var(--bgf,#000)}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;display:none}
#stage[data-fit=contain] .cell img{object-fit:contain}
.cell.filled img{display:block}
.hint{color:var(--muted);text-align:center;padding:10px;pointer-events:none;font-size:13px}
.cell.filled .hint{display:none}
.rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(20,21,24,.78);color:#fff;font-size:17px;line-height:1;cursor:pointer;display:none}
.cell.filled:hover .rm,.cell.filled:focus-within .rm{display:block}
.cell.dragging{opacity:.4}
.cell.over-swap::after,.cell.over-file::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--accent);background:rgba(127,178,255,.16)}
.drop{width:min(560px,100%);aspect-ratio:16/9;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);cursor:pointer;padding:20px}
.drop.over{border-color:var(--accent);background:rgba(127,178,255,.1);color:var(--text)}
#cutCv{max-width:100%;max-height:calc(100vh - 64px);box-shadow:0 0 0 1px var(--line)}
.palwrap{width:min(900px,100%);display:flex;flex-direction:column;gap:18px;align-items:stretch}
#palImg{max-height:38vh;max-width:100%;object-fit:contain;align-self:center;border-radius:6px}
#palBar{display:flex;height:44px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
#palList{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{border:0;border-radius:9px;padding:12px;min-height:84px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.sw b{font-size:15px}.sw span{font-size:12px;opacity:.85}
input[type=text]{background:var(--cell);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.tabs{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
#frGrid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-content:start}
.card{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.card span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th{position:relative;aspect-ratio:var(--tr);overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.th img{width:100%;height:100%;display:block}
.th:hover .rm{display:block}
#shCv{max-width:100%;max-height:calc(100vh - 64px);box-shadow:0 0 0 1px var(--line)}
#shList{display:flex;flex-direction:column;gap:6px}
.ri{display:grid;grid-template-columns:40px 1fr auto auto auto;gap:5px;align-items:center}
.ri img{width:40px;height:28px;object-fit:cover;border-radius:4px}
.ri input{padding:5px 7px}
.ri button{background:var(--cell);border:1px solid var(--line);border-radius:5px;width:26px;height:26px;cursor:pointer;padding:0}
#grCv{max-width:100%;max-height:calc(100vh - 64px);box-shadow:0 0 0 1px var(--line)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.nav{display:flex;align-items:center;gap:8px}
.nav span{flex:1;text-align:center;font-size:13px}
.nav button{width:36px;text-align:center}
#grInfo{word-break:break-all}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 16px;max-width:min(520px,90vw);opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.pbwrap{width:min(900px,100%);display:flex;flex-direction:column;gap:14px}
#pbOut{width:100%;min-height:52vh;background:var(--cell);border:1px solid var(--line);border-radius:10px;padding:16px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);resize:vertical}
#pbNotes{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13px}
#pbF{display:flex;flex-direction:column;gap:16px}
.msi{position:relative}
.msi input{padding-right:34px}
.msi button{position:absolute;right:2px;top:2px;bottom:2px;width:30px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px}
.msb{display:none;margin-top:4px;max-height:210px;overflow:auto;background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:4px 0}
.ms.open .msb{display:block}
.msb label{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.msb label:hover{background:var(--line)}
.msb input{accent-color:var(--accent)}
#pbTip svg{display:block;width:110px;height:auto;margin-bottom:6px}
#pbTip .tg{display:grid;grid-template-columns:repeat(2,118px);gap:8px;margin-top:8px}
#pbTip .tg svg{width:100%;margin:0}#pbTip .tg span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.msi button.msp{position:static;width:100%;text-align:left;padding:7px 30px 7px 9px;background:var(--cell);border:1px solid var(--line);border-radius:7px;color:var(--text);position:relative}
.msi button.msp::after{content:'▾';position:absolute;right:10px;color:var(--muted)}
.msb label.sel{color:var(--accent)}
#pbTip{position:fixed;z-index:50;display:none;max-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none}
</style>
</head>

const cam=(cx,cy,tx,ty)=>`<path d="M${cx} ${cy}L${tx} ${ty}" stroke-dasharray="3 3"/><rect x="${cx-5}" y="${cy-3.5}" width="10" height="7" rx="1.5" stroke="${PC}"/>`;

const topV=a=>{const ca=Math.cos(a),sa=Math.sin(a);return sv(`<circle cx="40" cy="22" r="7"/><path d="M${40+ca*7-sa*5} ${22+sa*7+ca*5}L${40+ca*15} ${22+sa*15}L${40+ca*7+sa*5} ${22+sa*7-ca*5}" stroke="${PC}"/>`+cam(40,49,40,31))};
const SZ=[[/extreme long|extreme wide|establishing/,.22],[/extreme close|ultra close|macro|insert/,0],[/medium close/,2.8],[/american/,1.35],[/medium|two-shot/,1.9],[/full shot/,.95],[/long|wide/,.45],[/close/,4.2]];

 if(/three-quarter/.test(n))return topV(Math.PI/4);if(/profile/.test(n))return topV(0);if(/rear/.test(n))return topV(-Math.PI/2);

 if(/frontal|facing/.test(n)&&!/close|medium|long|wide/.test(n))return topV(Math.PI/2);

 if(/fpv|first-person|subjective/.test(n))return sv(`<ellipse cx="40" cy="28" rx="26" ry="14"/><circle cx="40" cy="28" r="7" stroke="${PC}"/><circle cx="40" cy="28" r="2.5" fill="${PC}"/>`);

 for(const [re,k] of SZ)if(m=re.test(n)){if(!k)return sv(frm(`<ellipse cx="40" cy="28" rx="26" ry="14"/><circle cx="40" cy="28" r="8" stroke="${PC}"/>`));
  const y=k<1?46-37*k:k<1.5?8:k<2?5:k<3?10:22;return sv(frm(man(40,y,k)))}
