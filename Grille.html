<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille blanche – ajouter une grille sur une image</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%96%A6%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-text: #ffffff;
    --danger: #c9302c;
    --stage: #2b2b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #48484a;
      --accent: #0a84ff;
      --danger: #ff6961;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  header, main, footer { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 16px;
    padding-top: 16px;
    padding-bottom: 16px;
  }
  @media (max-width: 780px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }

  .stage {
    position: relative;
    height: min(72vh, 680px);
    min-height: 280px;
    background: var(--stage);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    padding: 12px;
  }
  .stage.has-image canvas { display: block; }
  .stage.has-image .empty { display: none; }
  .stage.dragging { outline: 3px dashed var(--accent); outline-offset: -8px; }

  .empty {
    background: none;
    border: 0;
    color: #d8d8dc;
    text-align: center;
    cursor: pointer;
    font: inherit;
    padding: 24px;
  }
  .empty .icon { font-size: 48px; line-height: 1; margin-bottom: 8px; }
  .empty strong { display: block; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .empty span { color: #a8a8ae; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-self: start;
  }
  .panel hr { border: 0; border-top: 1px solid var(--border); margin: 0; width: 100%; }

  button.btn {
    font: inherit;
    font-weight: 600;
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button.btn:hover:not(:disabled) { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible + label, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fileinfo { font-size: 12px; color: var(--muted); word-break: break-all; }
  .fileinfo b { color: var(--text); font-weight: 500; }

  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row output { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
  .control { display: block; }

  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { flex: 1; text-align: center; padding: 7px 0; cursor: pointer; }
  .seg input:checked + label { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .seglabel { margin-bottom: 6px; display: block; }

  .offsets { display: flex; flex-direction: column; gap: 14px; padding-left: 24px; }
  .offsets[hidden] { display: none; }

  #status { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  #status.error { color: var(--danger); }
  .note { font-size: 12px; color: var(--muted); margin: 0; }

  footer { padding-bottom: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Grille blanche</h1>
  <p>Ajoutez une grille blanche sur une image, puis exportez-la. Rien n’est envoyé sur internet : tout se passe dans votre navigateur.</p>
</header>

<main>
  <section class="stage" id="stage" aria-label="Aperçu">
    <canvas id="preview" aria-label="Aperçu de l’image avec la grille"></canvas>
    <button class="empty" id="empty" type="button">
      <div class="icon" aria-hidden="true">▦</div>
      <strong>Glissez une image ici</strong>
      <span>ou cliquez pour en choisir une (vous pouvez aussi la coller avec Ctrl/⌘ + V)</span>
    </button>
  </section>

  <aside class="panel" aria-label="Réglages">
    <button class="btn" id="choose" type="button">Choisir une image…</button>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="fileinfo" id="fileinfo" hidden></div>

    <hr>

    <label class="control" for="cols">
      <span class="row"><span>Colonnes</span><output id="colsOut">18</output></span>
      <input type="range" id="cols" min="1" max="60" step="1" value="18">
    </label>
    <label class="control" for="rows">
      <span class="row"><span>Rangées</span><output id="rowsOut">9</output></span>
      <input type="range" id="rows" min="1" max="60" step="1" value="9">
    </label>
    <label class="control" for="thick">
      <span class="row"><span>Épaisseur</span><output id="thickOut">4 px</output></span>
      <input type="range" id="thick" min="1" max="40" step="1" value="4">
    </label>
    <label class="control" for="opacity">
      <span class="row"><span>Opacité</span><output id="opacityOut">100 %</output></span>
      <input type="range" id="opacity" min="0" max="100" step="1" value="100">
    </label>
    <label class="check" for="outer">
      <input type="checkbox" id="outer"> Bordure extérieure
    </label>
    <label class="check" for="double">
      <input type="checkbox" id="double"> Doubler la grille (2 grilles décalées)
    </label>
    <div class="offsets" id="offsets" hidden>
      <label class="control" for="dx">
        <span class="row"><span>Décalage horizontal</span><output id="dxOut">50 %</output></span>
        <input type="range" id="dx" min="0" max="100" step="1" value="50">
      </label>
      <label class="control" for="dy">
        <span class="row"><span>Décalage vertical</span><output id="dyOut">50 %</output></span>
        <input type="range" id="dy" min="0" max="100" step="1" value="50">
      </label>
    </div>

    <hr>

    <div>
      <span class="seglabel" id="fmtLabel">Format d’export</span>
      <div class="seg" role="radiogroup" aria-labelledby="fmtLabel">
        <input type="radio" name="fmt" id="fmtPng" value="png" checked><label for="fmtPng">PNG</label>
        <input type="radio" name="fmt" id="fmtJpeg" value="jpeg"><label for="fmtJpeg">JPEG</label>
      </div>
    </div>

    <button class="btn primary" id="export" type="button" disabled>Exporter…</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note" id="pickerNote" hidden></p>
  </aside>
</main>

<footer>
  L’épaisseur est exprimée en pixels de l’image d’origine ; l’export garde la résolution d’origine.
</footer>

<script>
(() => {
  'use strict';

  // ==CORE-START==
  // Référence : grille 18 × 9, lignes de 4 px pour une image de 1920 px de large.
  const REF_WIDTH = 1920;
  const REF_THICKNESS = 4;

  function defaultThickness(width) {
    return Math.max(1, Math.round(width * REF_THICKNESS / REF_WIDTH));
  }

  // Épaisseur de ligne sur le canvas : proportionnelle à la largeur d’origine ;
  // arrondie au pixel entier pour l’export (aligned = true).
  function lineThickness(thickness, scale, aligned) {
    const t = thickness * scale;
    return aligned ? Math.max(1, Math.round(t)) : Math.max(0.5, t);
  }

  // Dessine la grille blanche. Toutes les lignes forment un seul tracé :
  // les croisements ne sont pas dessinés deux fois, même avec une opacité < 100 %.
  // Avec o.double, une seconde grille identique est ajoutée, décalée de o.dx / o.dy
  // (en fraction d’une cellule, de 0 à 1). Elle n’a jamais de bordure extérieure.
  function drawGrid(ctx, W, H, o) {
    const cols = Math.max(1, o.cols);
    const rows = Math.max(1, o.rows);
    const t = o.t;
    ctx.save();
    ctx.globalAlpha = o.opacity;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();

    const firstC = o.outer ? 0 : 1;
    const lastC  = o.outer ? cols : cols - 1;
    for (let i = firstC; i <= lastC; i++) {
      let x = W * i / cols - t / 2;
      if (i === 0) x = 0;
      if (i === cols) x = W - t;
      if (o.aligned) x = Math.round(x);
      ctx.rect(x, 0, t, H);
    }

    const firstR = o.outer ? 0 : 1;
    const lastR  = o.outer ? rows : rows - 1;
    for (let j = firstR; j <= lastR; j++) {
      let y = H * j / rows - t / 2;
      if (j === 0) y = 0;
      if (j === rows) y = H - t;
      if (o.aligned) y = Math.round(y);
      ctx.rect(0, y, W, t);
    }

    if (o.double) {
      const dx = Math.min(1, Math.max(0, o.dx || 0));
      const dy = Math.min(1, Math.max(0, o.dy || 0));
      for (let i = 0; i <= cols; i++) {
        const cx = W * (i + dx) / cols;
        if (cx <= 0 || cx >= W) continue;       // pas de ligne sur le bord de l’image
        let x = cx - t / 2;
        if (o.aligned) x = Math.round(x);
        ctx.rect(x, 0, t, H);
      }
      for (let j = 0; j <= rows; j++) {
        const cy = H * (j + dy) / rows;
        if (cy <= 0 || cy >= H) continue;
        let y = cy - t / 2;
        if (o.aligned) y = Math.round(y);
        ctx.rect(0, y, W, t);
      }
    }

    ctx.fill();
    ctx.restore();
  }
  // ==CORE-END==

  // ---------- Éléments de l’interface ----------
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), preview = $('preview'), emptyBtn = $('empty');
  const fileInput = $('file'), chooseBtn = $('choose'), exportBtn = $('export');
  const fileinfo = $('fileinfo'), statusEl = $('status'), pickerNote = $('pickerNote');
  const colsEl = $('cols'), rowsEl = $('rows'), thickEl = $('thick');
  const opacityEl = $('opacity'), outerEl = $('outer');
  const doubleEl = $('double'), dxEl = $('dx'), dyEl = $('dy'), offsetsEl = $('offsets');

  const PREVIEW_MAX = 1600;
  const canPick = typeof window.showSaveFilePicker === 'function';

  const state = { img: null, objectUrl: null, base: null, fullW: 0, fullH: 0, baseName: 'image' };

  if (canPick) {
    pickerNote.textContent = 'Le bouton « Exporter… » vous laisse choisir le dossier et le nom du fichier.';
  } else {
    pickerNote.textContent = 'Votre navigateur enregistre directement dans son dossier de téléchargements. Chrome, Edge et Opera permettent de choisir l’emplacement.';
  }
  pickerNote.hidden = false;

  // ---------- Messages ----------
  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', !!isError);
  }

  // ---------- Réglages ----------
  function settings() {
    return {
      cols: parseInt(colsEl.value, 10),
      rows: parseInt(rowsEl.value, 10),
      thickness: parseInt(thickEl.value, 10),
      opacity: parseInt(opacityEl.value, 10) / 100,
      outer: outerEl.checked,
      double: doubleEl.checked,
      dx: parseInt(dxEl.value, 10) / 100,
      dy: parseInt(dyEl.value, 10) / 100
    };
  }
  function gridOptions(s, t, aligned) {
    return {
      cols: s.cols, rows: s.rows, t: t, opacity: s.opacity, outer: s.outer, aligned: aligned,
      double: s.double, dx: s.dx, dy: s.dy
    };
  }
  function currentFormat() {
    return $('fmtJpeg').checked ? 'jpeg' : 'png';
  }
  function syncOutputs() {
    $('colsOut').textContent = colsEl.value;
    $('rowsOut').textContent = rowsEl.value;
    $('thickOut').textContent = thickEl.value + ' px';
    $('opacityOut').textContent = opacityEl.value + ' %';
    $('dxOut').textContent = dxEl.value + ' %';
    $('dyOut').textContent = dyEl.value + ' %';
  }

  // ---------- Aperçu ----------
  function renderPreview() {
    if (!state.base) return;
    const bw = state.base.width, bh = state.base.height;
    if (preview.width !== bw || preview.height !== bh) {
      preview.width = bw;
      preview.height = bh;
    }
    const ctx = preview.getContext('2d');
    ctx.clearRect(0, 0, bw, bh);
    ctx.drawImage(state.base, 0, 0);
    const s = settings();
    const scale = bw / state.fullW;
    drawGrid(ctx, bw, bh, gridOptions(s, lineThickness(s.thickness, scale, false), false));
  }

  // ---------- Chargement d’une image ----------
  async function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) {
      setStatus('Ce fichier n’est pas une image.', true);
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    try {
      await img.decode();
    } catch (e) {
      URL.revokeObjectURL(url);
      setStatus('Ce format d’image n’est pas pris en charge par votre navigateur.', true);
      return;
    }
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) {
      URL.revokeObjectURL(url);
      setStatus('Impossible de lire les dimensions de cette image.', true);
      return;
    }

    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
    state.img = img;
    state.objectUrl = url;
    state.fullW = w;
    state.fullH = h;
    state.baseName = (file.name || 'image').replace(/\.[^.]+$/, '') || 'image';

    // Version réduite de l’image, créée une fois pour des aperçus rapides.
    const k = Math.min(1, PREVIEW_MAX / Math.max(w, h));
    const base = document.createElement('canvas');
    base.width = Math.max(1, Math.round(w * k));
    base.height = Math.max(1, Math.round(h * k));
    const bctx = base.getContext('2d');
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(img, 0, 0, base.width, base.height);
    state.base = base;

    // Épaisseur par défaut proportionnelle à la référence.
    const def = defaultThickness(w);
    thickEl.max = String(Math.max(40, def * 3));
    thickEl.value = String(def);
    syncOutputs();

    fileinfo.innerHTML = '';
    const nameB = document.createElement('b');
    nameB.textContent = file.name || 'image collée';
    fileinfo.append(nameB, document.createElement('br'), w + ' × ' + h + ' px');
    fileinfo.hidden = false;

    stage.classList.add('has-image');
    exportBtn.disabled = false;
    setStatus('');
    renderPreview();
  }

  // ---------- Export ----------
  async function renderFull(fmt, mime) {
    const W = state.fullW, H = state.fullH;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const ctx = c.getContext('2d', { alpha: fmt !== 'jpeg' });
    if (!ctx) throw new Error('taille');
    if (fmt === 'jpeg') {              // le JPEG n’a pas de transparence : fond blanc
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(state.img, 0, 0, W, H);
    const s = settings();
    drawGrid(ctx, W, H, gridOptions(s, lineThickness(s.thickness, 1, true), true));
    const blob = await new Promise((resolve) => c.toBlob(resolve, mime, 0.95));
    if (!blob) throw new Error('taille');
    return blob;
  }

  function downloadBlob(blob, name) {
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 10000);
  }

  async function exportImage() {
    if (!state.img) return;
    const fmt = currentFormat();
    const mime = fmt === 'png' ? 'image/png' : 'image/jpeg';
    const ext = fmt === 'png' ? 'png' : 'jpg';
    const suggested = state.baseName + '_grille.' + ext;

    // La fenêtre « Enregistrer sous » doit s’ouvrir tout de suite après le clic.
    let handle = null;
    if (canPick) {
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: suggested,
          types: [{
            description: fmt === 'png' ? 'Image PNG' : 'Image JPEG',
            accept: { [mime]: fmt === 'png' ? ['.png'] : ['.jpg', '.jpeg'] }
          }]
        });
      } catch (e) {
        if (e && e.name === 'AbortError') return;   // l’utilisateur a annulé
        handle = null;                              // repli : téléchargement classique
      }
    }

    exportBtn.disabled = true;
    setStatus('Export en cours…');
    try {
      await new Promise((r) => setTimeout(r, 30));  // laisse l’interface se mettre à jour
      const blob = await renderFull(fmt, mime);
      if (handle) {
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        setStatus('Image exportée : ' + handle.name);
      } else {
        downloadBlob(blob, suggested);
        setStatus('Image exportée : ' + suggested + ' (dossier de téléchargements)');
      }
    } catch (e) {
      if (e && e.message === 'taille') {
        setStatus('Cette image est trop grande pour ce navigateur. Essayez sur ordinateur avec Chrome ou Edge, ou avec une image plus petite.', true);
      } else {
        setStatus('L’export a échoué : ' + (e && e.message ? e.message : 'erreur inconnue'), true);
      }
    } finally {
      exportBtn.disabled = !state.img;
    }
  }

  // ---------- Événements ----------
  [colsEl, rowsEl, thickEl, opacityEl, dxEl, dyEl].forEach((el) => {
    el.addEventListener('input', () => { syncOutputs(); renderPreview(); });
  });
  outerEl.addEventListener('change', renderPreview);
  doubleEl.addEventListener('change', () => {
    offsetsEl.hidden = !doubleEl.checked;
    renderPreview();
  });

  chooseBtn.addEventListener('click', () => fileInput.click());
  emptyBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
    fileInput.value = '';
  });
  exportBtn.addEventListener('click', exportImage);

  // Glisser-déposer
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.classList.add('dragging'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('dragging'));
  stage.addEventListener('drop', (e) => {
    e.preventDefault();
    stage.classList.remove('dragging');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });
  // Évite que le navigateur ouvre l’image si on la dépose à côté de la zone.
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());

  // Coller une image (Ctrl/⌘ + V)
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items) {
      if (it.kind === 'file' && /^image\//.test(it.type)) {
        const f = it.getAsFile();
        if (f) { e.preventDefault(); loadFile(f); }
        break;
      }
    }
  });

  syncOutputs();
})();
</script>
</body>
</html>
